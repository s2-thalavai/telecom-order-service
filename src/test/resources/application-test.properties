# Test profile: fast downstreams, short deadlines
spring.datasource.url=jdbc:h2:mem:orderstest;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
spring.jpa.hibernate.ddl-auto=create-drop
spring.mvc.async.request-timeout=10s

telecom.orders.workflow-deadline=1s
telecom.orders.default-await=2s
telecom.orders.max-await=5s
telecom.orders.bulk-item-timeout=1s

telecom.simulation.credit-latency=50ms
telecom.simulation.catalog-latency=50ms
telecom.simulation.inventory-latency=30ms
telecom.simulation.portability-latency=50ms
telecom.simulation.provisioning-latency=500ms
telecom.simulation.slow-delay=2500ms
