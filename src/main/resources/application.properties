# =====================================================================
# Telecom order service. Profiles: default (H2), prod (MySQL + Flyway), test
# =====================================================================
spring.application.name=telecom-order-service
server.port=${SERVER_PORT:8080}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=45s

# ---------- Servlet async ----------
# Default timeout for CompletableFuture / DeferredResult without their own timeout (-> 503)
spring.mvc.async.request-timeout=30s
server.tomcat.threads.max=200
# waiting long-polls hold connections, not threads
server.tomcat.max-connections=8192

# ---------- Data ----------
spring.datasource.url=jdbc:h2:mem:orders;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
# >= concurrent persisting stages + callbacks
spring.datasource.hikari.maximum-pool-size=20
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=false

spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# ---------- Order workflow (OrderProperties) ----------
# CompletableFuture chain deadline -> 504 (and no order is persisted after it)
telecom.orders.workflow-deadline=5s
# DeferredResult long-poll: default and cap (keep the cap below the ingress timeout)
telecom.orders.default-await=20s
telecom.orders.max-await=55s
telecom.orders.minimum-credit-score=650
# per-number timeout in bulk portability checks
telecom.orders.bulk-item-timeout=2s

# ---------- Simulated downstream systems (SimulationProperties) ----------
# Email triggers: slow -> slow credit bureau, down -> bureau unavailable, risky -> low score,
#                 provfail -> provisioning fails, manual -> no automatic callback (use the webhook)
telecom.simulation.credit-latency=400ms
telecom.simulation.catalog-latency=300ms
telecom.simulation.inventory-latency=250ms
telecom.simulation.portability-latency=400ms
telecom.simulation.provisioning-latency=3s
telecom.simulation.slow-delay=10s

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
