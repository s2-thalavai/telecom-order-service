# MySQL 8.4 + order service (prod profile). Console: http://localhost:8080
name: telecom-orders

services:
  mysql:
    image: mysql:8.4
    container_name: orders-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_pass_change_me}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-orders}
      MYSQL_USER: ${MYSQL_USER:-orders_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-orders_pass_change_me}
      TZ: UTC
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  app:
    build: .
    image: telecom-order-service:1.0.0
    container_name: orders-app
    restart: unless-stopped
    stop_grace_period: 60s
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:-orders}
      DB_USERNAME: ${MYSQL_USER:-orders_user}
      DB_PASSWORD: ${MYSQL_PASSWORD:-orders_pass_change_me}
      TELECOM_SIMULATION_PROVISIONING_LATENCY: ${TELECOM_SIMULATION_PROVISIONING_LATENCY:-3s}
      TELECOM_ORDERS_WORKFLOW_DEADLINE: ${TELECOM_ORDERS_WORKFLOW_DEADLINE:-5s}
    ports:
      - "${APP_PORT:-8080}:8080"

volumes:
  mysql-data:
